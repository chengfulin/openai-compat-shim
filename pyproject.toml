[project]
name = "openai-compat-shim"
version = "0.1.0"
description = "OpenAI-compatible proxy for http://192.168.x.x:8000 with implicit model-name mapping"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
